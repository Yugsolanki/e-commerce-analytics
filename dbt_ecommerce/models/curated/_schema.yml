version: 2

models:
  - name: dim_customers
    description: ""
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        data_tests:
          - not_null
      - name: customer_zip_code
        data_tests:
          - not_null
      - name: customer_city
        data_tests:
          - not_null
      - name: customer_state
        data_tests:
          - not_null
      - name: geolocation_lat
      - name: geolocation_lng
  
  - name: dim_dates
    description: ""
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null
      - name: date_id
        data_tests:
          - not_null
      - name: year_number
        data_tests:
          - not_null
      - name: quarter_of_year
        data_tests:
          - not_null
      - name: month_of_year
        data_tests:
          - not_null
      - name: month_name
        data_tests:
          - not_null
      - name: day_name
        data_tests:
          - not_null
      - name: day_of_week
        data_tests:
          - not_null
      - name: week_of_year
        data_tests:
          - not_null
      - name: year_month
        data_tests:
          - not_null
      - name: is_weekend
        data_tests:
          - not_null
  
  - name: dim_products
    description: ""
    columns:
      - name: product_id
        data_tests:
          - not_null
      - name: product_category
      - name: product_weight_g
      - name: product_length_cm
      - name: product_height_cm
      - name: product_width_cm
      - name: product_volume_cm3
  
  - name: dim_sellers
    description: ""
    columns:
      - name: seller_id
        data_tests:
          - unique
          - not_null
      - name: seller_zip_code
        data_tests:
          - not_null
      - name: seller_city
        data_tests:
          - not_null
      - name: seller_state
        data_tests:
          - not_null
      - name: geolocation_lat
      - name: geolocation_lng
  
  - name: fct_order_items
    description: ""
    columns:
      - name: order_item_key
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
      - name: order_item_id
        data_tests:
          - not_null
      - name: customer_id
        data_tests:
          - not_null
      - name: order_purchase_date
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null
      - name: seller_id
        data_tests:
          - not_null
      - name: shipping_limit_date
        data_tests:
          - not_null
      - name: price
        data_tests:
          - not_null
      - name: freight_value
        data_tests:
          - not_null
      - name: line_total
        data_tests:
          - not_null
    
  - name: fct_orders
    description: ""
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
      - name: order_purchase_date
        data_tests:
          - not_null
      - name: delivered_date
      - name: order_status
        data_tests:
          - not_null
      - name: order_purchase_timestamp
        data_tests:
          - not_null
      - name: order_approved_at
      - name: order_delivered_carrier_date
      - name: order_delivered_customer_date
      - name: order_estimated_delivery_date
        data_tests:
          - not_null
      - name: item_count
        data_tests:
          - not_null
      - name: product_count
        data_tests:
          - not_null
      - name: seller_count
        data_tests:
          - not_null
      - name: item_value_total
      - name: freight_total
      - name: order_value_total
      - name: payment_count
      - name: payment_value_total
      - name: installments_max
      - name: primary_payment_type
      - name: review_count
      - name: avg_review_score
      - name: commented_review_count
      - name: hours_to_approval
      - name: days_to_delivery
        data_tests:
          - not_null:
              config:
                where: "order_status = 'delivered' and order_delivered_customer_date is not null"
      - name: is_late
        data_tests:
          - not_null:
              config:
                where: "order_status = 'delivered' and order_delivered_customer_date is not null"
      - name: delay_days
        data_tests:
          - not_null:
              config:
                where: "order_status = 'delivered' and order_delivered_customer_date is not null"