version: 2

models:
  - name: int_geolocation_deduped
    description: ""
    columns:
      - name: geolocation_zip_code
        data_tests:
          - unique
          - not_null
      - name: geolocation_lat
        data_tests:
          - not_null
      - name: geolocation_lng
        data_tests:
          - not_null
      - name: geolocation_city
        data_tests:
          - not_null
      - name: geolocation_state
        data_tests:
          - not_null
      - name: ingestion_timestamp
        data_tests:
          - not_null
  
  - name: int_order_items_agg
    description: ""
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "order_value_total - item_value_total - freight_total = 0"
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: item_count
        data_tests:
          - not_null
      - name: product_count
        data_tests:
          - not_null
      - name: seller_count
        data_tests:
          - not_null
      - name: item_value_total
        data_tests:
          - not_null
      - name: freight_total
        data_tests:
          - not_null
      - name: order_value_total
        data_tests:
          - not_null
      - name: ingestion_timestamp
        data_tests:
          - not_null
  
  - name: int_order_payments_agg
    description: ""
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: payment_count
        data_tests:
          - not_null
      - name: payment_value_total
        data_tests:
          - not_null
      - name: installments_max
        data_tests:
          - not_null
      - name: primary_payment_type
        data_tests:
          - not_null
      - name: credit_card_value
        data_tests:
          - not_null
      - name: ingestion_timestamp
        data_tests:
          - not_null

  - name: int_order_reviews_agg
    description: ""
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: review_count
        data_tests:
          - not_null
      - name: avg_review_score
        data_tests:
          - not_null
      - name: commented_review_count
        data_tests:
          - not_null
      - name: ingestion_timestamp
        data_tests:
          - not_null

  - name: int_orders_enriched
    description: ""
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["shipped","unavailable","invoiced","created","approved","processing","delivered","canceled"]
      - name: order_purchase_timestamp
        data_tests:
          - not_null
      - name: hours_to_approval
      - name: days_to_delivery
        data_tests:
          - not_null:
              config:
                where: "order_status = 'delivered' and order_delivered_customer_date is not null"
      - name: is_late
        data_tests:
          - not_null:
              config:
                where: "order_status = 'delivered' and order_delivered_customer_date is not null"
      - name: delay_days
        data_tests:
          - not_null:
              config:
                where: "order_status = 'delivered' and order_delivered_customer_date is not null"
      - name: ingestion_timestamp
        data_tests:
          - not_null

  - name: int_products_enriched
    description: ""
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: product_category_name
      - name: product_name_length
      - name: product_description_length
      - name: product_photos_qty
      - name: product_weight_g
      - name: product_length_cm
      - name: product_height_cm
      - name: product_width_cm
      - name: ingestion_timestamp
        data_tests:
          - not_null

  - name: int_orders_joined
    description: ""
    columns:
      # --- keys ---
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
      # --- customer attributes ---
      - name: customer_unique_id
        data_tests:
          - not_null
      - name: customer_zip_code
        data_tests:
          - not_null
      - name: customer_city
        data_tests:
          - not_null
      - name: customer_state
        data_tests:
          - not_null
      # --- order attributes ---
      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["shipped","unavailable","invoiced","created","approved","processing","delivered","canceled"]
      - name: order_purchase_timestamp
        data_tests:
          - not_null
      - name: hours_to_approval
      - name: days_to_delivery
        data_tests:
          - not_null:
              config:
                where: "order_status = 'delivered' and order_delivered_customer_date is not null"
      - name: is_late
        data_tests:
          - not_null:
              config:
                where: "order_status = 'delivered' and order_delivered_customer_date is not null"
      - name: delay_days
        data_tests:
          - not_null:
              config:
                where: "order_status = 'delivered' and order_delivered_customer_date is not null"
      # --- financial & payment attributes ---
      - name: order_value_total
      - name: freight_total
      - name: payment_value_total
      - name: primary_payment_type
      - name: avg_review_score
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
      - name: ingestion_timestamp
        data_tests:
          - not_null