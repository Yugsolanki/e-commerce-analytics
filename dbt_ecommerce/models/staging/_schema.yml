version: 2

models:
  - name: stg_customers
    description: "staging model for customers table"
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        data_tests:
          - not_null
      - name: customer_zip_code
        data_tests:
          - not_null
      - name: customer_city
        data_tests:
          - not_null
      - name: customer_state
        data_tests:
          - not_null
      - name: ingestion_timestamp
        data_tests:
          - not_null
  
  - name: stg_geolocation
    description: "staging model for geolocation table"
    columns:
      - name: geolocation_zip_code
        data_tests:
          - not_null
      - name: geolocation_lat
        data_tests:
          - not_null
      - name: geolocation_lng
        data_tests:
          - not_null
      - name: geolocation_city
        data_tests:
          - not_null
      - name: geolocation_state
        data_tests:
          - not_null
      - name: ingestion_timestamp
        data_tests:
          - not_null

  - name: stg_order_items
    description: "staging model for order_items table"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id
    columns:
      - name: order_id
        data_tests:
          - not_null
      - name: order_item_id
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null
      - name: seller_id
        data_tests:
          - not_null
      - name: shipping_limit_date
        data_tests:
          - not_null
      - name: price
        data_tests:
          - not_null
      - name: freight_value
        data_tests:
          - not_null
      - name: ingestion_timestamp
        data_tests:
          - not_null
    
  - name: stg_order_payments
    description: "staging model for order_payments table"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - payment_sequential
    columns:
      - name: order_id
        data_tests:
          - not_null
      - name: payment_sequential
        data_tests:
          - not_null
      - name: payment_type
        data_tests:
          - not_null
      - name: payment_installments
        data_tests:
          - not_null
      - name: payment_value
        data_tests:
          - not_null
      - name: ingestion_timestamp
        data_tests:
          - not_null
    
  - name: stg_order_reviews
    description: "staging model for order_reviews table"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - review_id
              - order_id
    columns:
      - name: review_id
        data_tests:
          - not_null
      - name: order_id
        data_tests:
          - not_null
      - name: score
        data_tests:
          - not_null
      - name: review_comment_title
      - name: review_comment_message
      - name: review_creation_date
        data_tests:
          - not_null
      - name: review_answer_timestamp
        data_tests:
          - not_null
      - name: ingestion_timestamp
        data_tests:
          - not_null
  
  - name: stg_orders
    description: "staging model for orders table"
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
      - name: order_status
        data_tests:
          - not_null
      - name: order_purchase_timestamp
        data_tests:
          - not_null
      - name: order_approved_at
      - name: order_delivered_carrier_date
      - name: order_delivered_customer_date
      - name: order_estimated_delivery_date
        data_tests:
          - not_null
      - name: ingestion_timestamp
        data_tests:
          - not_null

  - name: stg_products
    description: "staging model for products table"
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: product_category_name
      - name: product_name_length
      - name: product_description_length
      - name: product_photos_qty
      - name: product_weight_g
      - name: product_length_cm
      - name: product_height_cm
      - name: product_width_cm
      - name: ingestion_timestamp
        data_tests:
          - not_null
  
  - name: stg_sellers
    description: "staging model for sellers table"
    columns:
      - name: seller_id
        data_tests:
          - unique
          - not_null
      - name: seller_zip_code
        data_tests:
          - not_null
      - name: seller_city
        data_tests:
          - not_null
      - name: seller_state
        data_tests:
          - not_null
      - name: ingestion_timestamp
        data_tests:
          - not_null

  - name: stg_product_category_name_translation
    description: "staging model for product_category_name_translation table"
    columns:
      - name: product_category_name
        data_tests:
          - unique
          - not_null
      - name: product_category_name_english
        data_tests:
          - unique
          - not_null
      - name: ingestion_timestamp
        data_tests:
          - not_null